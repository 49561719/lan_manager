      - name: Disable Lint vital in all subprojects (url_launcher crash workaround)
        run: |
          for f in android/build.gradle.kts android/build.gradle; do
            [ -f "$f" ] && printf '\nsubprojects { tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false } }\n' >> "$f"
          done

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup our files
        run: |
          cp -r lib "$RUNNER_TEMP/lib_backup"
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml"
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/AndroidManifest.xml"

      - name: Generate missing Android project files
        run: flutter create . --platforms=android --org com.albakr

      - name: Restore our files
        run: |
          cp -r "$RUNNER_TEMP/lib_backup/." lib/
          cp "$RUNNER_TEMP/pubspec.yaml" pubspec.yaml
          cp "$RUNNER_TEMP/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lan-manager-release
          path: build/app/outputs/flutter-apk/app-release.apk
